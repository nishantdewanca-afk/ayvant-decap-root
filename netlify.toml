# ayvant.ca (Next.js static export in /site). This repo is a copy of the ayvant-us-blog codebase,
# kept in sync by ayvant-us-blog/scripts/sync-ca-repo.sh. NEXT_PUBLIC_SITE = "ca" builds the Canadian site.
[build]
  base = "site"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_SITE = "ca"
  # "true": indexable, with the sitemap in robots.txt. Set to "false" to hide the whole site from search engines.
  NEXT_PUBLIC_INDEXABLE = "true"

[[headers]]
  for = "/og/*"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/blog/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Redirects are written by site/scripts/redirects.mjs into _redirects at build time.
